<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel Admin Kartu Ucapan</title>
<style>
:root{--bg:#0d0714;--card:#1a1026;--line:#3a2552;--tx:#f6eefc;--mu:#a996bd;--ac:#ff6fa8;--ac2:#9a6bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif;padding:0 0 90px}
header{padding:20px 16px 8px}h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:var(--mu);font-size:13px}
main{padding:8px 12px;max-width:760px;margin:auto}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0}
summary{padding:14px;font-weight:600;cursor:pointer;list-style:none}summary::after{content:"＋";float:right;color:var(--ac)}details[open] summary::after{content:"－"}
.body{padding:0 14px 14px}.f{margin:12px 0}.f>label,.lb{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-bottom:5px}
input[type=text],input[type=number],select,textarea{width:100%;background:#0f0919;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
textarea{resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid var(--ac2)}
.cnt{font-variant-numeric:tabular-nums}.cnt.bad{color:#ff5c7a;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{background:#2a1a3d;color:#ffc2da;border:0;border-radius:99px;padding:4px 10px;font-size:12px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2a1a3d}
.sw input{appearance:none;width:46px;height:26px;border-radius:99px;background:#3a2552;position:relative;flex:none;transition:.2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--ac)}.sw input:checked::after{left:23px}
.g3{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px}.note{font-size:12px;color:var(--mu);margin-top:5px}
.age{background:#2a1a3d;border-radius:10px;padding:8px 10px;font-size:13px;color:#ffc2da;margin-top:8px}
.gd{border-top:1px solid #2a1a3d;padding:10px 0}.gd code{background:#2a1a3d;color:#ffc2da;border-radius:6px;padding:2px 8px;font-weight:700}.gd p{margin:6px 0 0;font-size:13.5px}.gd small{color:var(--mu);display:block;margin-top:4px}.file{font-size:12px;color:var(--mu);margin-top:6px;width:100%}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0d0714ee;border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:5}
.bar button{flex:1;border:0;border-radius:12px;padding:13px;font:600 15px system-ui;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}.bar .alt{background:#2a1a3d}
.reset{display:block;margin:18px auto;background:none;border:1px solid var(--line);color:var(--mu);border-radius:10px;padding:8px 14px}
#pv{position:fixed;inset:0;background:#05020a;z-index:20;display:none;flex-direction:column}#pv.on{display:flex}
.pvbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:#120a1d;border-bottom:1px solid var(--line)}
#modes{display:flex;gap:6px;flex-wrap:wrap}.pvbar button{border:1px solid var(--line);border-radius:99px;background:#2a1a3d;color:#fff;padding:7px 12px;font-size:13px}.pvbar button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;overflow:hidden;border-radius:18px;box-shadow:0 0 0 3px #3a2552}#pv iframe{border:0;background:#000;display:block;transform-origin:0 0}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#2a1a3d;border:1px solid var(--ac);border-radius:10px;padding:8px 14px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:30}#toast.on{opacity:1}
</style></head><body>
<header><h1>🎂 Panel Admin Kartu Ucapan</h1><p>Ubah semua isi kartu, lihat hasilnya lewat Preview, lalu Download.</p></header>
<main id="app"></main>
<div class="bar"><button class="alt" id="bPv">👁 Preview</button><button id="bDl">⬇ Download index.html</button></div>
<div id="pv"><div class="pvbar"><div id="modes"></div><button id="pvX">✕ Tutup</button></div><div id="stage"><div id="wrap"><iframe allow="autoplay; fullscreen"></iframe></div></div></div>
<div id="toast"></div>
<script>
const TEMPLATE = "<!DOCTYPE html>\n<html lang=\"id\">\n<head>\n<meta charset=\"UTF-8\">\n<\script>\n/* [KODE: ERR-01] Penangkap salah ketik: jika PENGATURAN di bawah rusak (mis. tanda ` atau koma terhapus),\n   halaman menampilkan pesan yang jelas, bukan layar kosong. Bagian ini tidak perlu diubah. */\n(function () {\n  var first = null;\n  window.addEventListener('error', function (e) { if (!first) first = { msg: e.message, line: e.lineno }; });\n  document.addEventListener('DOMContentLoaded', function () {\n    if (typeof KARTU !== 'undefined') return;\n    var d = document.createElement('div');\n    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#1a0710;color:#fff;font:16px/1.65 system-ui,sans-serif;padding:26px;overflow:auto';\n    var h = document.createElement('h2'); h.textContent = '⚠️ Ada salah ketik di PENGATURAN KARTU'; h.style.color = '#ff9db8'; d.appendChild(h);\n    var p = document.createElement('div');\n    p.innerHTML = 'Buka file <b>index.html<\/b>, lihat bagian <b>PENGATURAN KARTU<\/b> di paling atas, lalu periksa:<ol>' +\n      '<li>Tanda <b>`<\/b> (backtick, tombol di kiri angka 1) di awal dan akhir setiap teks <b>tidak ada yang terhapus<\/b>.<\/li>' +\n      '<li><b>Koma ( , )<\/b> di ujung setiap baris tidak terhapus.<\/li>' +\n      '<li>Di dalam teks <b>tidak ada<\/b> karakter <b>`<\/b> atau <b>${<\/b>.<\/li>' +\n      '<li>Tanda kurung kurawal <b>{ }<\/b> dan <b>[ ]<\/b> tidak terhapus.<\/li><\/ol>';\n    d.appendChild(p);\n    if (first) { var t = document.createElement('div'); t.style.cssText = 'margin-top:14px;font:13px/1.5 monospace;color:#ffd0dd'; t.textContent = 'Pesan teknis: ' + first.msg + (first.line ? ' (sekitar baris ' + first.line + ')' : ''); d.appendChild(t); }\n    document.body.appendChild(d);\n  });\n})();\n<\/script>\n<\!--\n##########################################################################\n#                                                                        #\n#   PENGATURAN KARTU UCAPAN   (kode: CUS-01)                             #\n#                                                                        #\n#   >>> HANYA BAGIAN INI YANG PERLU ANDA UBAH <<<                        #\n#   Semua tulisan, nama, tanggal, surat, dan doa ada di sini.            #\n#   Bagian setelah tulisan \"AKHIR PENGATURAN KARTU\" JANGAN disentuh.     #\n#                                                                        #\n#   CARA MENGGANTI (3 langkah)                                           #\n#   1. Cari tulisan yang ingin diganti di bawah ini.                     #\n#   2. Ganti HANYA isi di antara tanda ` ` (backtick). Jangan hapus      #\n#      tanda ` ` itu dan jangan hapus koma (,) di ujung baris.           #\n#   3. Simpan file, lalu buka/refresh di browser untuk melihat hasilnya. #\n#                                                                        #\n#   ATURAN PENTING                                                       #\n#   - Setiap kolom punya BATAS HURUF (tertulis \"maks.\" di sebelahnya;    #\n#     spasi, emoji, dan baris kosong ikut dihitung). Jika terlalu       #\n#     panjang, teks dipotong otomatis agar tampilan tidak rusak, dan    #\n#     muncul kotak peringatan merah (selama TAMPILKAN_KODE : true).      #\n#   - Di dalam teks JANGAN memakai karakter ` dan ${                    #\n#   - Di surat, pisahkan paragraf dengan SATU BARIS KOSONG.              #\n#   - File lagu & foto harus satu folder dengan index.html ini.          #\n#   - Angka (tanggal, bulan, tahun) ditulis tanpa tanda ` `.             #\n#                                                                        #\n#   KATA AJAIB (otomatis diganti saat tampil, boleh dipakai di teks)     #\n#     {nama}          -> nama penerima (mis. Wiyaa)                      #\n#     {pemberi}       -> nama pemberi/pengirim (mis. Handres)            #\n#     {usia}          -> umur yang dirayakan (mis. 19)                   #\n#     {usia_en}       -> umur gaya Inggris (mis. 19th)                   #\n#     {tanggal}       -> tanggal ulang tahun berikutnya                  #\n#     {tanggal_lahir} -> tanggal lahir lengkap                           #\n#   (hanya {nama} {pemberi} {usia} {usia_en} yang boleh di surat/doa;    #\n#    {tanggal} dan {tanggal_lahir} hanya di kolom yang menyebutkannya.)  #\n#                                                                        #\n##########################################################################\n-->\n<\script>\nconst KARTU = {\n\n  /* ===== 1. IDENTITAS ===================================================== */\n  NAMA_PEMBERI   : `penggemar rahasia`,     // nama pengirim kartu                      (maks. 20 huruf)\n  NAMA_PENERIMA  : `davina karamoy`,       // nama yang berulang tahun                 (maks. 20 huruf)\n\n  /* ===== 2. TANGGAL ULANG TAHUN (angka saja, tanpa tanda ` `) ============== */\n  TGL_LAHIR      : 17,            // tanggal lahir, angka 1-31\n  BLN_LAHIR      : 8,             // bulan lahir, angka 1-12 (12 = Desember)\n  THN_LAHIR      : 2002,          // tahun lahir (dipakai untuk hitung umur & hitungan hari)\n  USIA           : null,          // umur yang dirayakan. Biarkan null = dihitung otomatis,\n                                  // atau isi angka (mis. 19) jika ingin dipaksa\n\n  /* ===== 3. FILE & PENGATURAN ============================================= */\n  LAGU           : `song.mp3`,    // nama file lagu (satu folder dengan index.html). Kosongkan `` jika tanpa lagu\n  FOTO           : [],            // foto untuk puzzle, mis. [`foto1.jpg`, `foto2.jpg`]. Kosong [] = gambar otomatis\n  VOLUME_AWAL    : 0.2,           // volume awal: 0 (senyap) sampai 1 (maksimal)\n  PUZZLE_UKURAN  : 3,             // ukuran puzzle: 3 = 3x3 (mudah), 4 = 4x4, maksimal 5\n  TAMPILKAN_KODE : false,          // true  = MODE UJI: label kode revisi + kotak peringatan batas huruf tampil.\n                                  // false = tampilan bersih. WAJIB diganti false sebelum kartu dikirim/dijual\n\n  /* ===== 3B. FITUR (true = aktif, false = nonaktif) ========================= */\n  AKTIF_MUSIK: true, AKTIF_PUZZLE: true, AKTIF_SKIP: true, AKTIF_STIKER: true,\n  AKTIF_HITUNG_MUNDUR: true, AKTIF_SURAT: true, AKTIF_DOA: true, AKTIF_UMUR: true,\n\n  /* ===== 4. TEKS LAYAR AWAL (loading, puzzle, tombol) ===================== */\n  JUDUL_TAB      : `Happy Birthday 💗`,                           // tulisan di tab browser                (maks. 40 huruf)\n  TEKS_LOADING   : `Tunggu yaa sayangg`,                          // tulisan saat loading                  (maks. 40 huruf)\n  JUDUL_PUZZLE   : `Susun bintangnya dulu yaa, {nama} ✨`,        // judul di atas puzzle                  (maks. 60 huruf)\n  PETUNJUK_PUZZLE: `Geser kepingan ke ruang kosong sampai gambarnya utuh`,  // petunjuk puzzle            (maks. 80 huruf)\n  PUZZLE_SELESAI : `Bintangnya sudah tersusun, sayang 💫`,        // tulisan setelah puzzle utuh           (maks. 50 huruf)\n  TEKS_TOMBOL_SKIP : `Skip ⏭`,                                    // tombol lewati puzzle                  (maks. 12 huruf)\n  TEKS_TOMBOL_MASUK: `Masuk`,                                     // tombol masuk ke galaksi               (maks. 12 huruf)\n  TEKS_PERJALANAN  : `Membawamu ke galaksi terindah di alam semesta…`,  // tulisan saat perjalanan        (maks. 70 huruf)\n\n  /* ===== 5. TEKS GALAKSI & HATI =========================================== */\n  JUDUL_GALAKSI  : `Happy {usia_en} Birthday, {nama} 🎂`,            // judul besar di atas hati              (maks. 50 huruf)\n  TEKS_HATI      : `LOVE`,                                        // tulisan di tengah hati, sebaiknya HURUF BESAR (maks. 8 huruf)\n  PETUNJUK_GALAKSI_1: `Ketuk emoji lucu di antara bintang 💫`,    // petunjuk bawah, baris 1               (maks. 50 huruf)\n  PETUNJUK_GALAKSI_2: `Geser, putar & zoom sesuka hatimu ✨`,     // petunjuk bawah, baris 2 (boleh kosong) (maks. 50 huruf)\n\n  /* ===== 6. NAMA 4 EMOJI (muncul saat kursor diarahkan ke emoji) ========== */\n  LABEL_EMOJI_HITUNG_MUNDUR : `Hitung mundur ulang tahun`,        // emoji kiri atas                       (maks. 40 huruf)\n  LABEL_EMOJI_SURAT         : `Surat ucapan ulang tahun`,         // emoji kanan atas                      (maks. 40 huruf)\n  LABEL_EMOJI_DOA           : `Harapan & doa`,                    // emoji kiri bawah                      (maks. 40 huruf)\n  LABEL_EMOJI_UMUR          : `Sudah berapa lama kamu di dunia`,  // emoji kanan bawah                     (maks. 40 huruf)\n\n  /* ===== 7. SURAT UCAPAN ULANG TAHUN ====================================== */\n  SURAT_UCAPAN_JUDUL : `Happy {usia_en} Birthday, {nama}! 💗🎂`,     //                                       (maks. 50 huruf)\n  SURAT_UCAPAN_ISI   : `\nSelamat ulang tahun, {nama}. ❤️\n\nDi usia kamu yang ke-{usia} ini, aku berharap semoga banyak kebahagiaan datang ke hidup kamu, semua impian kamu perlahan terwujud, dan senyum manis kamu selalu punya alasan untuk tetap ada.\n\nMakasih ya, sayang, udah hadir di hidup aku. Kalau aku boleh berharap satu hal, aku ingin tetap jadi orang yang bisa nemenin kamu melewati banyak ulang tahun berikutnya.\n\nI love you, today, tomorrow, and in all the days to come. 💗\n\nWith love, {pemberi} ♡\n`,                                                                // ISI SURAT: maks. 800 huruf (termasuk spasi & baris kosong)\n\n  /* ===== 8. SURAT HARAPAN & DOA =========================================== */\n  SURAT_DOA_JUDUL : `My Wishes & Prayers for You 💗`,             //                                       (maks. 50 huruf)\n  SURAT_DOA_ISI   : `\nDi usia kamu yang ke-{usia} ini, aku berdoa semoga kamu selalu diberi kesehatan, kebahagiaan, dan kemudahan dalam setiap langkah. Semoga kuliah kamu lancar, impian kamu satu per satu terwujud, dan kamu selalu dikelilingi hal-hal baik.\n\nKalau suatu hari kamu lelah, semoga kamu selalu punya alasan untuk tersenyum lagi. Aku juga berharap, semoga kita bisa terus bersama, saling menguatkan, dan merayakan lebih banyak ulang tahun bersama.\n\nSemoga dunia selalu baik sama kamu, sayang. Dan kalau suatu saat dunia terasa berat, semoga aku bisa menjadi salah satu alasan kamu tetap tersenyum. ❤️\n\nAlways wishing the best for you,\n{pemberi} ♡\n`,                                                                // ISI DOA: maks. 800 huruf (termasuk spasi & baris kosong)\n\n  /* ===== 9. JENDELA HITUNG MUNDUR ========================================= */\n  JUDUL_HITUNG_MUNDUR : `Hitung Mundur Ulang Tahun ⏳`,           //                                       (maks. 40 huruf)\n  SUB_HITUNG_MUNDUR   : `Menuju {tanggal}, hari ketika {nama} genap {usia} tahun.`,  //                  (maks. 100 huruf)\n  COUNTDOWN_HARI_H    : `Hari ini hari spesialmu, selamat ulang tahun sayang! 🎉`,  // tampil jika hari ini ultahnya (maks. 80 huruf)\n  COUNTDOWN_BELUM     : `Sedikit lagi, sayang… aku sudah tidak sabar. 💗`,          // tampil jika belum    (maks. 80 huruf)\n  UNIT_HARI   : `HARI`,    // (maks. 10 huruf)\n  UNIT_JAM    : `JAM`,     // (maks. 10 huruf)\n  UNIT_MENIT  : `MENIT`,   // (maks. 10 huruf)\n  UNIT_DETIK  : `DETIK`,   // (maks. 10 huruf)\n\n  /* ===== 10. JENDELA \"SUDAH BERAPA LAMA DI DUNIA\" ========================= */\n  JUDUL_UMUR   : `Perjalananmu di Dunia 🧸`,                       //                                       (maks. 40 huruf)\n  SUB_UMUR     : `Sejak pertama kali {nama} lahir pada {tanggal_lahir}, kamu sudah melewati:`,  //        (maks. 120 huruf)\n  PENUTUP_UMUR : `Dan di setiap detik itu, kamu selalu berharga banget buat aku. 💗`,           //        (maks. 100 huruf)\n  UNIT_TAHUN   : `TAHUN`,  // (maks. 10 huruf)\n  UNIT_BULAN   : `BULAN`,  // (maks. 10 huruf)\n  TOTAL_HARI   : `Total hari`,   // (maks. 14 huruf)\n  TOTAL_JAM    : `Total jam`,    // (maks. 14 huruf)\n  TOTAL_MENIT  : `Total menit`,  // (maks. 14 huruf)\n  TOTAL_DETIK  : `Total detik`,  // (maks. 14 huruf)\n\n  /* ===== 11. TULISAN PADA GAMBAR PUZZLE (hanya jika FOTO kosong) ========== */\n  TEKS_GAMBAR_ATAS  : `Happy {usia_en} Birthday`,                  //                                       (maks. 30 huruf)\n  TEKS_GAMBAR_BAWAH : `with love, {pemberi} ♡`                     //                                       (maks. 35 huruf)\n};\n<\/script>\n<\!-- ######################## AKHIR PENGATURAN KARTU ######################## -->\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no\">\n<title>Happy Birthday 💗<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap\" rel=\"stylesheet\">\n\n<\!--\n==========================================================================\n PETA KODE REVISI  (format: 1 angka + 1 huruf, mis. \"4D\")\n Sebut kodenya ke AI, misal: \"ubah 4D\" atau \"perbesar 5A\".\n Kode layar yang sedang tampil (1A loading, 2A puzzle, 3A perjalanan, 4A galaksi,\n 6C-6F jendela) muncul kecil di POJOK KIRI BAWAH.\n Tekan tombol \"<\/>\" di kiri bawah (atau tombol K) untuk menampilkan label\n kode tepat di atas tiap elemen. Setel TAMPILKAN_KODE:false di CUS-01\n sebelum kartu dikirim ke pelanggan.\n\n 1  LAYAR LOADING        1A layar  1B tulisan \"Tunggu yaa\"  1C wadah persen+bar\n                         1D angka persen  1E bar  1F catatan/pesan error\n 2  LAYAR PUZZLE (3x3)   2A layar  2B judul  2C petunjuk  2D papan puzzle\n                         2E slot tombol  2F tombol Skip  2G tombol Masuk\n 3  PERJALANAN (WARP)    3A layar  3B tulisan perjalanan  (garis bintang = WRP-10)\n 4  GALAKSI & HATI       4A kanvas 3D, bintang latar, Bima Sakti, nebula\n                         4B galaksi spiral   4C lubang kecil + inti bercahaya\n                         4D asap bintang yang membentuk hati   4E tulisan LOVE\n                         4F judul \"Happy Birthday\"   4G petunjuk bawah\n                         4H kontrol 3D (geser, putar, zoom)\n 5  EMOJI (STIKER LUCU)  5A hitung mundur  5B surat ucapan  5C harapan & doa\n                         5D umur sejak lahir  5E stiker dekorasi\n 6  JENDELA (MODAL)      6A jendela  6B tombol tutup  6C isi hitung mundur\n                         6D isi surat ucapan  6E isi harapan & doa  6F isi umur\n 7  MUSIK                7A wadah  7B play/pause  7C slider volume\n 8  PENGATURAN           8A blok CUS-01 di paling atas file (nama, tanggal, surat, dst)\n 9  ALAT                 9A tombol \"<\/>\" label kode\n\n Kode lama (untuk mencari di komentar [KODE: ...] pada CSS/JS):\n CUS-01 = 8A | CFG-01 konfigurasi teknis | DAT-01 penerapan data | TYP-01 mesin ketik\n FADE-01 animasi masuk/keluar | LOAD-10 download lagu & foto | PZL-10 logika puzzle\n PZL-11 gambar puzzle | PZL-12 tombol skip 5 detik | PZL-13 tombol Masuk\n GLX-01/02 = 4A | GLX-03 = 4B | GLX-04/GLX-05 = 4C | HRT-01 = 4D | HRT-02 = 4E\n HRT-03 = 4F | HNT-01 = 4G | CTL-01 = 4H | ICN-01 sistem stiker | ICN-DEC = 5E\n AUD = 7A-7C | MOD = 6A-6F | KOD-01 = 9A\n CUS-02 = pemeriksa batas huruf & angka | ERR-01 = penangkap salah ketik pada pengaturan\n==========================================================================\n-->\n\n<style>\n/* [KODE: CUS-02] kotak peringatan batas huruf (hanya tampil saat TAMPILKAN_KODE : true) */\n#admin-warn{position:fixed;left:10px;top:10px;z-index:9999;max-width:min(94vw,540px);padding:12px 40px 12px 14px;border-radius:12px;\n  background:rgba(120,15,45,.95);border:1px solid #ff9db8;color:#fff;font:600 12.5px/1.55 system-ui,sans-serif;text-align:left;box-shadow:0 6px 30px rgba(0,0,0,.55)}\n#admin-warn b{display:block;margin-bottom:4px;color:#ffd0dd}\n#admin-warn div{margin-top:2px}\n#admin-warn button{position:absolute;top:6px;right:8px;background:none;border:0;color:#fff;font-size:20px;line-height:1;cursor:pointer}\n/* [KODE: CFG-STYLE] Variabel warna */\n:root{\n  --pink:#ff7eb6; --violet:#a98bff; --cyan:#7fd8ff;\n  --glass:rgba(14,10,40,.58); --line:rgba(255,255,255,.16);\n}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;height:100%;overflow:hidden;background:#01020a;color:#fff;\n  font-family:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif}\n.dance{font-family:'Dancing Script','Segoe Script','Brush Script MT',cursive;font-weight:700}\n\n/* [KODE: GLX-00] kanvas 3D */\n#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none;outline:none}\n\n/* [KODE: FADE-01] animasi masuk/keluar umum */\n.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;\n  padding:16px;text-align:center;opacity:0;visibility:hidden;pointer-events:none;\n  transition:opacity 1.2s ease,visibility 0s linear 1.2s}\n.screen.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity 1.2s ease,visibility 0s}\n#warp{pointer-events:none!important}\n.fx{opacity:0;transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s ease;pointer-events:none}\n.fx.in{opacity:1;transform:none;pointer-events:auto}\n.caret{display:inline-block;width:2px;height:1.05em;background:currentColor;margin-left:3px;margin-right:-5px;vertical-align:-.15em;animation:blink .8s steps(1) infinite}\n@keyframes blink{50%{opacity:0}}\n.glow{text-shadow:0 0 18px rgba(255,126,182,.75),0 0 42px rgba(169,139,255,.55)}\n\n/* [KODE: LOAD-01] layar loading */\n#load-title{font-size:clamp(34px,8vw,60px);margin:0 0 26px;min-height:1.3em}\n#load-wrap{width:min(320px,80vw)}\n#load-pct{font-size:26px;font-weight:700;letter-spacing:1px;margin-bottom:12px;font-variant-numeric:tabular-nums}\n#load-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;border:1px solid var(--line)}\n#load-fill{display:block;height:100%;width:0;border-radius:99px;\n  background:linear-gradient(90deg,#7fd8ff,#a98bff,#ff7eb6);box-shadow:0 0 14px rgba(255,126,182,.8)}\n#load-note{margin-top:18px;min-height:1.4em;font-size:14px;color:#ffd1e6;max-width:80vw;line-height:1.6}\n\n/* [KODE: PZL-01] layar puzzle\n   Tata letak 3 baris: teks (2B+2C) rata tengah di antara tepi atas & papan, papan (2D) di tengah layar,\n   tombol (2E-2G) rata tengah di antara papan & tepi bawah. */\n#puzzle{display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);grid-template-columns:100%;justify-items:center;align-items:center}\n#pzl-top{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:92vw}\n#pzl-bottom{display:flex;align-items:center;justify-content:center;width:100%}\n#puzzle #pzl-title{margin:0 0 6px}\n#puzzle #pzl-sub{margin:0}\n#puzzle .btn-slot{margin-top:0}\n#pzl-title{font-size:clamp(28px,6vw,46px);margin:0 0 6px;min-height:1.3em}\n#pzl-sub{margin:0 0 16px;font-size:15px;color:#dcd2ff;min-height:1.4em}\n#pzl-board{--bs:480px;position:relative;width:var(--bs);height:var(--bs);border-radius:14px;\n  background:rgba(255,255,255,.05);box-shadow:0 0 0 1px var(--line),0 20px 70px rgba(120,70,255,.35),0 0 60px rgba(255,126,182,.18);touch-action:manipulation}\n.tile{position:absolute;cursor:pointer;transition:left .24s ease,top .24s ease,opacity 1.2s ease,box-shadow 1.2s ease;\n  box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);user-select:none}\n.tile:hover{filter:brightness(1.18)}\n.tile.ghost{opacity:0;pointer-events:none}\n#pzl-board.solved .tile{box-shadow:inset 0 0 0 0 rgba(255,255,255,0)}\n#pzl-board.solved .tile.ghost{opacity:1}\n.btn-slot{display:grid;place-items:center;height:64px;width:100%;margin-top:16px}\n.btn-slot>*{grid-area:1/1}\n.btn{font-family:inherit;color:#fff;font-weight:600;font-size:15px;padding:11px 26px;border-radius:99px;cursor:pointer;\n  background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);\n  box-shadow:0 0 22px rgba(169,139,255,.3);transition:opacity 1.1s ease,transform 1.1s ease,box-shadow .3s}\n.btn:hover{box-shadow:0 0 30px rgba(255,126,182,.6)}\n.btn.big{font-size:24px;padding:13px 54px;background:linear-gradient(135deg,rgba(255,126,182,.55),rgba(169,139,255,.55));\n  box-shadow:0 0 34px rgba(255,126,182,.55)}\n.btn span{display:inline-block;min-width:1ch;min-height:1.2em}\n\n/* [KODE: AUD-01] kontrol musik kanan atas */\n#audio{position:fixed;top:14px;right:14px;z-index:60;display:flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;\n  border-radius:99px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}\n#a-toggle{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;color:#fff;display:grid;place-items:center;\n  background:linear-gradient(135deg,#ff7eb6,#a98bff);box-shadow:0 0 14px rgba(255,126,182,.6)}\n#a-toggle svg{width:16px;height:16px;fill:#fff}\n#a-toggle .i-pause{display:none}\n#audio.playing #a-toggle .i-pause{display:block}\n#audio.playing #a-toggle .i-play{display:none}\n#a-vol{-webkit-appearance:none;appearance:none;width:92px;height:4px;border-radius:9px;background:rgba(255,255,255,.28);outline:none;cursor:pointer}\n#a-vol::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 0 10px #ff7eb6}\n#a-vol::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 10px #ff7eb6}\n\n/* [KODE: WRP-01] teks perjalanan warp */\n#warp-text{font-size:clamp(22px,4.6vw,38px);max-width:88vw;line-height:1.5;min-height:1.5em;margin:0}\n\n/* [KODE: HRT-03] judul 3D & [KODE: HNT-01] petunjuk */\n#title3d{position:fixed;top:12vh;transform:translateY(-50%);left:0;right:0;z-index:20;text-align:center;pointer-events:none;padding:0 16px;\n  font-size:clamp(26px,5.2vw,52px);min-height:1.3em;opacity:0;transition:opacity 1s ease}\n#title3d.in{opacity:1}\n#hint{position:fixed;bottom:4.5vh;left:0;right:0;z-index:20;text-align:center;pointer-events:none;font-size:15px;color:#e5dcff;\n  padding:0 16px;min-height:1.4em;opacity:0;transition:opacity .9s ease;white-space:pre-line;line-height:1.7}\n#hint.in{opacity:1}\n#tip{position:fixed;z-index:30;pointer-events:none;padding:6px 14px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;\n  background:rgba(10,8,34,.78);border:1px solid var(--line);opacity:0;transition:opacity .3s;transform:translate(-50%,-170%)}\n#tip.in{opacity:1}\n\n/* [KODE: MOD-01] jendela modal */\n#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:14px;\n  visibility:hidden;pointer-events:none;transition:visibility 0s linear .8s}\n#modal::before{content:'';position:absolute;inset:0;background:rgba(2,2,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);\n  opacity:0;transition:opacity .6s ease}\n#modal.show{visibility:visible;pointer-events:auto;transition:visibility 0s}\n#modal.show::before{opacity:1}\n/* [KODE: MOD-ANIM] panel dianimasikan lewat JS (Modal.play): tumbuh dari emoji yang diketuk, menyusut kembali saat ditutup */\n#panel{position:relative;z-index:1;width:min(94vw,580px);min-height:min(60vh,380px);max-height:84vh;overflow:auto;padding:30px 26px 28px;border-radius:22px;\n  background:linear-gradient(160deg,rgba(40,20,90,.78),rgba(12,8,38,.86));border:1px solid var(--line);\n  box-shadow:0 0 60px rgba(169,139,255,.35),0 0 30px rgba(255,126,182,.2);will-change:transform,opacity}\n#panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:9px}\n/* [KODE: MOD-02] tombol tutup */\n#mclose{position:sticky;float:right;top:-14px;margin:-18px -10px 0 0;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);\n  background:rgba(255,255,255,.1);color:#fff;font-size:15px;cursor:pointer;z-index:2}\n#mclose:hover{background:rgba(255,126,182,.4)}\n.m-title{font-size:clamp(26px,5.6vw,34px);margin:0 0 14px;min-height:1.3em;line-height:1.25;text-wrap:balance}\n.m-sub{font-size:15.5px;line-height:1.7;color:#e6dcff;margin:0 0 16px;min-height:1.5em}\n.paper p{white-space:pre-line;font-size:17px;line-height:1.95;margin:0 0 18px;color:#fff4fa}\n.cd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 18px}\n.cd-grid.three{grid-template-columns:repeat(3,1fr)}\n.cd-box{padding:14px 4px 10px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid var(--line);text-align:center}\n.cd-box b{display:block;font-size:clamp(26px,7vw,40px);font-variant-numeric:tabular-nums;line-height:1.1;\n  background:linear-gradient(135deg,#ffd1e6,#cbb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}\n.cd-box small{font-size:12px;color:#d9ceff;letter-spacing:.5px}\n.m-foot{font-size:15px;line-height:1.7;color:#ffd7ea;margin:6px 0 0;min-height:1.4em}\n.totals{display:grid;gap:6px;font-size:14.5px;color:#e6dcff;margin:6px 0 14px;font-variant-numeric:tabular-nums}\n.totals div{padding:8px 12px;border-radius:12px;background:rgba(255,255,255,.07);display:flex;justify-content:space-between;gap:10px}\n.totals div b{color:#ffd1e6}\n\n/* [KODE: KOD-01] label kode */\n#kode-btn{position:fixed;left:12px;bottom:12px;z-index:70;width:34px;height:28px;border-radius:9px;border:1px solid var(--line);\n  background:rgba(10,8,34,.5);color:#cbb8ff;font-size:12px;cursor:pointer;opacity:.35;transition:opacity .3s}\n#kode-btn:hover,body.show-kode #kode-btn{opacity:1}\nbody.show-kode [data-kode]{outline:1px dashed rgba(80,255,210,.75);outline-offset:2px}\n.kbadge{position:fixed;z-index:80;pointer-events:none;font:600 10px/1 monospace;color:#001a14;background:#5dffd6;padding:2px 5px;border-radius:4px;white-space:nowrap}\n#kode-now{position:fixed;left:52px;bottom:17px;z-index:70;font:600 10px/1 monospace;color:#5dffd6;opacity:.6;pointer-events:none;letter-spacing:.5px;white-space:nowrap;transition:opacity .25s ease}\nbody.no-kode #kode-btn,body.no-kode #kode-now{display:none}\nnoscript{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#01020a;color:#fff;padding:20px;text-align:center}\n\n@media (max-width:520px){#audio{top:10px;right:10px;padding:6px 12px 6px 6px;gap:8px}#a-vol{width:70px}#panel{padding:26px 18px 22px}.paper p{font-size:16px}\n  #pzl-title{font-size:clamp(24px,6.6vw,30px)}#pzl-sub{font-size:13.5px;margin-bottom:12px}\n  .btn-slot{height:54px;margin-top:10px}.btn.big{font-size:21px;padding:11px 44px}}\n<\/style>\n<\/head>\n<body>\n<noscript>Aktifkan JavaScript untuk membuka kejutan ini 💗<\/noscript>\n\n<canvas id=\"gl\" data-kode=\"4A\"><\/canvas>\n\n<\!-- [KODE: LOAD-01] LAYAR LOADING -->\n<section id=\"loader\" class=\"screen\" data-kode=\"1A\">\n  <h1 id=\"load-title\" class=\"dance glow\" data-kode=\"1B\"><\/h1>\n  <div id=\"load-wrap\" class=\"fx\" data-kode=\"1C\">\n    <div id=\"load-pct\" data-kode=\"1D\">0%<\/div>\n    <div id=\"load-bar\" data-kode=\"1E\"><i id=\"load-fill\"><\/i><\/div>\n  <\/div>\n  <div id=\"load-note\" data-kode=\"1F\"><\/div>\n<\/section>\n\n<\!-- [KODE: PZL-01] LAYAR PUZZLE -->\n<section id=\"puzzle\" class=\"screen\" data-kode=\"2A\">\n  <div id=\"pzl-top\">\n    <h2 id=\"pzl-title\" class=\"dance glow\" data-kode=\"2B\"><\/h2>\n    <p id=\"pzl-sub\" data-kode=\"2C\"><\/p>\n  <\/div>\n  <div id=\"pzl-board\" class=\"fx\" data-kode=\"2D\"><\/div>\n  <div id=\"pzl-bottom\">\n    <div class=\"btn-slot\" data-kode=\"2E\">\n      <button id=\"btn-skip\" class=\"btn fx\" data-kode=\"2F\"><span><\/span><\/button>\n      <button id=\"btn-masuk\" class=\"btn big fx\" data-kode=\"2G\"><span><\/span><\/button>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- [KODE: WRP-01] LAYAR PERJALANAN WARP -->\n<section id=\"warp\" class=\"screen\" data-kode=\"3A\">\n  <p id=\"warp-text\" class=\"dance glow\" data-kode=\"3B\"><\/p>\n<\/section>\n\n<\!-- [KODE: AUD-01] KONTROL MUSIK -->\n<div id=\"audio\" class=\"fx\" data-kode=\"7A\">\n  <button id=\"a-toggle\" aria-label=\"Putar atau jeda musik\" data-kode=\"7B\">\n    <svg class=\"i-play\" viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>\n    <svg class=\"i-pause\" viewBox=\"0 0 24 24\"><path d=\"M6 5h4v14H6zm8 0h4v14h-4z\"/><\/svg>\n  <\/button>\n  <input id=\"a-vol\" type=\"range\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0.6\" aria-label=\"Volume\" data-kode=\"7C\">\n<\/div>\n\n<div id=\"title3d\" class=\"dance glow\" data-kode=\"4F\"><\/div>\n<div id=\"hint\" data-kode=\"4G\"><\/div>\n<div id=\"tip\"><\/div>\n\n<\!-- [KODE: MOD-01] MODAL -->\n<div id=\"modal\" data-kode=\"6A\">\n  <div id=\"panel\">\n    <button id=\"mclose\" aria-label=\"Tutup\" data-kode=\"6B\">✕<\/button>\n    <div id=\"mcontent\"><\/div>\n  <\/div>\n<\/div>\n\n<div id=\"kode-now\"><\/div>\n<button id=\"kode-btn\" title=\"Tampilkan / sembunyikan label kode (K)\" data-kode=\"9A\">&lt;/&gt;<\/button>\n\n<\script src=\"https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js\"><\/script>\n<\script src=\"https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js\"><\/script>\n<\script>\n'use strict';\n/* ========================================================================\n   [KODE: CUS-02] PEMERIKSA PENGATURAN: batas huruf, angka, dan nilai bawaan.\n   Teks yang terlalu panjang dipotong otomatis supaya tampilan tidak rusak.\n   (Angka batas ada di BATAS di bawah ini; sebaiknya tidak diubah.)\n   ======================================================================== */\nconst BATAS = {\n  NAMA_PEMBERI: 20, NAMA_PENERIMA: 20,\n  JUDUL_TAB: 40, TEKS_LOADING: 40, JUDUL_PUZZLE: 60, PETUNJUK_PUZZLE: 80, PUZZLE_SELESAI: 50,\n  TEKS_TOMBOL_SKIP: 12, TEKS_TOMBOL_MASUK: 12, TEKS_PERJALANAN: 70,\n  JUDUL_GALAKSI: 50, TEKS_HATI: 8, PETUNJUK_GALAKSI_1: 50, PETUNJUK_GALAKSI_2: 50,\n  LABEL_EMOJI_HITUNG_MUNDUR: 40, LABEL_EMOJI_SURAT: 40, LABEL_EMOJI_DOA: 40, LABEL_EMOJI_UMUR: 40,\n  SURAT_UCAPAN_JUDUL: 50, SURAT_UCAPAN_ISI: 800, SURAT_DOA_JUDUL: 50, SURAT_DOA_ISI: 800,\n  JUDUL_HITUNG_MUNDUR: 40, SUB_HITUNG_MUNDUR: 100, COUNTDOWN_HARI_H: 80, COUNTDOWN_BELUM: 80,\n  UNIT_HARI: 10, UNIT_JAM: 10, UNIT_MENIT: 10, UNIT_DETIK: 10,\n  JUDUL_UMUR: 40, SUB_UMUR: 120, PENUTUP_UMUR: 100, UNIT_TAHUN: 10, UNIT_BULAN: 10,\n  TOTAL_HARI: 14, TOTAL_JAM: 14, TOTAL_MENIT: 14, TOTAL_DETIK: 14,\n  TEKS_GAMBAR_ATAS: 30, TEKS_GAMBAR_BAWAH: 35\n};\n/* nilai bawaan jika sebuah baris terhapus/kosong (surat & doa sengaja tidak punya nilai bawaan) */\nconst KARTU_DEF = {\n  JUDUL_TAB: 'Happy Birthday 💗', TEKS_LOADING: 'Tunggu yaa', JUDUL_PUZZLE: 'Susun bintangnya dulu yaa, {nama} ✨',\n  PETUNJUK_PUZZLE: 'Geser kepingan ke ruang kosong sampai gambarnya utuh', PUZZLE_SELESAI: 'Bintangnya sudah tersusun 💫',\n  TEKS_TOMBOL_SKIP: 'Skip ⏭', TEKS_TOMBOL_MASUK: 'Masuk', TEKS_PERJALANAN: 'Membawamu ke galaksi terbesar di alam semesta…',\n  JUDUL_GALAKSI: 'Happy {usia_en} Birthday, {nama}', TEKS_HATI: 'LOVE',\n  LABEL_EMOJI_HITUNG_MUNDUR: 'Hitung mundur ulang tahun', LABEL_EMOJI_SURAT: 'Surat ucapan ulang tahun',\n  LABEL_EMOJI_DOA: 'Harapan & doa', LABEL_EMOJI_UMUR: 'Sudah berapa lama kamu di dunia',\n  JUDUL_HITUNG_MUNDUR: 'Hitung Mundur Ulang Tahun ⏳', SUB_HITUNG_MUNDUR: 'Menuju {tanggal}, hari ketika {nama} genap {usia} tahun.',\n  COUNTDOWN_HARI_H: 'Hari ini hari spesialmu, selamat ulang tahun! 🎉', COUNTDOWN_BELUM: 'Sedikit lagi… aku sudah tidak sabar. 💗',\n  UNIT_HARI: 'HARI', UNIT_JAM: 'JAM', UNIT_MENIT: 'MENIT', UNIT_DETIK: 'DETIK', UNIT_TAHUN: 'TAHUN', UNIT_BULAN: 'BULAN',\n  JUDUL_UMUR: 'Perjalananmu di Dunia 🧸', SUB_UMUR: 'Sejak pertama kali {nama} lahir pada {tanggal_lahir}, kamu sudah melewati:',\n  PENUTUP_UMUR: 'Dan di setiap detik itu, kamu selalu berharga buat aku. 💗',\n  TOTAL_HARI: 'Total hari', TOTAL_JAM: 'Total jam', TOTAL_MENIT: 'Total menit', TOTAL_DETIK: 'Total detik',\n  TEKS_GAMBAR_ATAS: 'Happy {usia_en} Birthday', TEKS_GAMBAR_BAWAH: 'with love, {pemberi} ♡'\n};\nconst KARTU_WARN = [];\n(function prepKartu() {\n  const K = KARTU, N = t => Array.from(t).length;\n  const cutText = (t, max) => {\n    let a = Array.from(t).slice(0, max - 1).join(''); const sp = a.lastIndexOf(' ');\n    if (sp > max * .6) a = a.slice(0, sp);\n    return a.replace(/[\\s,;:.\\-]+$/, '') + '…';\n  };\n  for (const k in KARTU_DEF) if (K[k] == null || String(K[k]).trim() === '') K[k] = KARTU_DEF[k];\n  for (const k in BATAS) {\n    let v = String(K[k] == null ? '' : K[k]).replace(/\\r/g, '').replace(/^\\uFEFF/, '').trim();\n    if (N(v) > BATAS[k]) { KARTU_WARN.push(k + ' : ' + N(v) + ' huruf, batasnya ' + BATAS[k] + ' → dipotong otomatis'); v = cutText(v, BATAS[k]); }\n    K[k] = v;\n  }\n  const num = (k, min, max, def, label) => {\n    const v = Number(K[k]);\n    if (!Number.isFinite(v) || v < min || v > max || K[k] === null || K[k] === '') { KARTU_WARN.push(k + ' : nilai \"' + K[k] + '\" tidak valid (harus ' + min + '–' + max + ') → dipakai ' + def); K[k] = def; }\n    else K[k] = v;\n  };\n  num('BLN_LAHIR', 1, 12, 12); num('TGL_LAHIR', 1, 31, 25);\n  const dim = new Date(2024, K.BLN_LAHIR, 0).getDate();\n  if (K.TGL_LAHIR > dim) { KARTU_WARN.push('TGL_LAHIR : bulan ke-' + K.BLN_LAHIR + ' hanya punya ' + dim + ' hari → dipakai ' + dim); K.TGL_LAHIR = dim; }\n  const thn = Number(K.THN_LAHIR);\n  if (K.THN_LAHIR !== null && K.THN_LAHIR !== '' && !(thn >= 1900 && thn <= new Date().getFullYear())) { KARTU_WARN.push('THN_LAHIR : \"' + K.THN_LAHIR + '\" tidak valid → diabaikan'); K.THN_LAHIR = null; }\n  if (K.USIA !== null && K.USIA !== undefined && K.USIA !== '' && !(Number(K.USIA) >= 1 && Number(K.USIA) <= 150)) { KARTU_WARN.push('USIA : \"' + K.USIA + '\" tidak valid → dihitung otomatis'); K.USIA = null; }\n  num('VOLUME_AWAL', 0, 1, .6);\n  K.PUZZLE_UKURAN = Math.round(Number(K.PUZZLE_UKURAN)); num('PUZZLE_UKURAN', 2, 5, 3);\n  if (!Array.isArray(K.FOTO)) { KARTU_WARN.push('FOTO : harus berbentuk daftar, mis. [`foto1.jpg`] → diabaikan'); K.FOTO = []; }\n  K.LAGU = String(K.LAGU || '').trim();\n  /* kotak peringatan merah: hanya saat MODE UJI (TAMPILKAN_KODE : true) */\n  if (KARTU_WARN.length) {\n    console.warn('[PENGATURAN KARTU]\\n' + KARTU_WARN.join('\\n'));\n    if (K.TAMPILKAN_KODE !== false) {\n      const box = document.createElement('div'); box.id = 'admin-warn';\n      const h = document.createElement('b'); h.textContent = '⚠️ Ada isian yang perlu diperbaiki di PENGATURAN KARTU:'; box.appendChild(h);\n      KARTU_WARN.forEach(w => { const d = document.createElement('div'); d.textContent = '• ' + w; box.appendChild(d); });\n      const x = document.createElement('button'); x.textContent = '×'; x.setAttribute('aria-label', 'Tutup peringatan'); x.onclick = () => box.remove(); box.appendChild(x);\n      document.body.appendChild(box);\n    }\n  }\n})();\n/* menerjemahkan \"kata ajaib\" seperti {nama} menjadi isi sebenarnya */\nfunction fill(str, extra) {\n  const v = Object.assign({ nama: DATA.name, pemberi: DATA.giver, usia: DATA.age || '', usia_en: DATA.age ? DATA.age + ordinal(DATA.age) : '' }, extra || {});\n  return String(str == null ? '' : str).replace(/\\{(\\w+)\\}/g, (m, k) => (k in v ? v[k] : m)).replace(/(\\S) {2,}(\\S)/g, '$1 $2').trim();\n}\nconst esc = t => String(t).replace(/[&<>\"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;' }[c]));\n\n/* ========================================================================\n   [KODE: CFG-01] KONFIGURASI TEKNIS (nama, teks, lagu, foto ada di CUS-01 paling atas file)\n   ======================================================================== */\nconst CFG = {\n  SONG_FILE : (KARTU.AKTIF_MUSIK === false ? '' : KARTU.LAGU) || '',                // diatur di CUS-01 (paling atas file)\n  IMAGES    : KARTU.FOTO || [],                // diatur di CUS-01 (di-download saat loading)\n  TYPE_MS   : 55,        // jeda per huruf (ms). ~18 huruf/detik ≈ kecepatan baca rata-rata orang Indonesia\n  PAUSE_END : 260,       // jeda tambahan setelah . ! ?\n  PAUSE_MID : 120,       // jeda tambahan setelah , ; :\n  PAUSE_NL  : 380,       // jeda tambahan setelah baris baru\n  SKIP_DELAY: 5000,      // tombol skip muncul 5 detik SETELAH mulai bermain puzzle\n  PUZZLE_N  : KARTU.PUZZLE_UKURAN || 3,   // ukuran puzzle (default 3x3), diatur di CUS-01\n  SHUFFLE   : 20 * (KARTU.PUZZLE_UKURAN || 3), // jumlah langkah acak (makin besar makin sulit)\n  VOLUME    : KARTU.VOLUME_AWAL\n};\nconst IS_MOBILE = /Android|iPhone|iPad|iPod|Mobi/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 600;\nconst Q = IS_MOBILE\n  ? {disc:32000,bulge:9000,halo:2500,haze:3000,dust:4000,bgStars:7000,bgBand:6000,hOut:1600,hIn:800,hFill:2600,hText:1100,hSmoke:350}\n  : {disc:75000,bulge:22000,halo:6000,haze:8000,dust:10000,bgStars:9000,bgBand:10000,hOut:2600,hIn:1400,hFill:4200,hText:1800,hSmoke:700};\n\n/* ========================= UTIL ========================= */\nconst $ = s => document.querySelector(s);\nconst sleep = ms => new Promise(r => setTimeout(r, ms));\nconst rand = (a, b) => a + Math.random() * (b - a);\nconst clamp = (v, a, b) => Math.min(b, Math.max(a, v));\nconst smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };\nconst easeIO3 = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;\nconst easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };\nfunction gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }\nconst MONTHS = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];\nconst cap = s => s.charAt(0).toUpperCase() + s.slice(1);\nfunction ordinal(n) { const m = n % 100; if (m >= 11 && m <= 13) return 'th'; return ({1:'st',2:'nd',3:'rd'})[n % 10] || 'th'; }\nconst state = { stage: 'loading' };\n\n/* ========================================================================\n   [KODE: TYP-01] MESIN ANIMASI MENGETIK\n   ======================================================================== */\n/* judul jendela dikecilkan otomatis agar muat 1 baris; jika tetap tak muat, dibagi 2 baris seimbang SEBELUM mengetik (tidak pindah baris saat diketik) */\nasync function fitTitle(el, text) {\n  try { await document.fonts.ready; } catch (e) {}\n  el.style.fontSize = ''; el.style.whiteSpace = 'nowrap';\n  const sp = document.createElement('span'); sp.textContent = text; el.textContent = ''; el.appendChild(sp);\n  const room = el.clientWidth - 46;                      // sisakan tempat untuk tombol tutup\n  let fs = parseFloat(getComputedStyle(el).fontSize);\n  while (sp.offsetWidth > room && fs > 21) { fs -= 1; el.style.fontSize = fs + 'px'; }\n  if (sp.offsetWidth > room) { el.style.fontSize = ''; el.style.whiteSpace = ''; }\n}\nasync function typeEl(el, text, opt = {}) {\n  const tok = opt.tok || { cancel: false };\n  const speed = opt.speed || CFG.TYPE_MS;\n  text = text.replace(/[ \\t]+((?:\\p{Extended_Pictographic}|\\uFE0F|\\u200D)+)$/u, '\\u00A0$1');   // emoji di ujung selalu menempel dengan kata terakhir\n  if (el.classList.contains('m-title')) { await fitTitle(el, text); if (tok.cancel) return false; }\n  el.textContent = '';\n  const node = document.createTextNode('');\n  const caret = document.createElement('span'); caret.className = 'caret';\n  const rest = document.createElement('span'); rest.style.visibility = 'hidden'; rest.textContent = text;   // sisa teks: tak terlihat, tapi sudah memakan tempat\n  el.appendChild(node); el.appendChild(caret); el.appendChild(rest);\n  const chars = Array.from(text); let buf = '';\n  for (let n = 0; n < chars.length; n++) {\n    const ch = chars[n];\n    if (tok.cancel) { caret.remove(); return false; }\n    buf += ch; node.nodeValue = buf; rest.textContent = chars.slice(n + 1).join('');\n    if (opt.scroll) opt.scroll.scrollTop = opt.scroll.scrollHeight;\n    let d = speed;\n    if ('.!?'.includes(ch)) d += CFG.PAUSE_END;\n    else if (',;:'.includes(ch)) d += CFG.PAUSE_MID;\n    else if (ch === '\\n') d += CFG.PAUSE_NL;\n    await sleep(d);\n  }\n  rest.remove();\n  if (!opt.keepCaret) caret.remove();\n  return true;\n}\n\n/* ========================================================================\n   [KODE: DAT-01] PENERAPAN DATA DARI CUS-01 (tidak ada lagi file txt)\n   ======================================================================== */\nlet DATA = { giver: 'Aku', name: 'Sayang', age: 0, day: 25, month: 11, birthYear: null, letter: '', prayer: '' };\nfunction applyKartu() {\n  const K = KARTU, tidy = t => String(t || '').replace(/\\r/g, '').replace(/^\\uFEFF/, '').trim();\n  DATA.giver = K.NAMA_PEMBERI || DATA.giver;\n  DATA.name  = K.NAMA_PENERIMA || DATA.name;\n  DATA.day   = +K.TGL_LAHIR || DATA.day;\n  DATA.month = (+K.BLN_LAHIR || DATA.month + 1) - 1;\n  DATA.birthYear = +K.THN_LAHIR || null;\n  DATA.age = +K.USIA || (DATA.birthYear ? nextBirthday().getFullYear() - DATA.birthYear : 0);\n  DATA.letter = fill(tidy(K.SURAT_UCAPAN_JUDUL)) + '\\n\\n' + fill(tidy(K.SURAT_UCAPAN_ISI));\n  DATA.prayer = fill(tidy(K.SURAT_DOA_JUDUL)) + '\\n\\n' + fill(tidy(K.SURAT_DOA_ISI));\n  document.title = K.JUDUL_TAB || document.title;\n  document.body.classList.toggle('no-kode', K.TAMPILKAN_KODE === false);\n}\nfunction nextBirthday() {\n  const now = new Date();\n  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());\n  let d = new Date(now.getFullYear(), DATA.month, DATA.day);\n  if (d < today) d = new Date(now.getFullYear() + 1, DATA.month, DATA.day);\n  return d;\n}\nfunction getBirthDate() {\n  const by = DATA.birthYear || (nextBirthday().getFullYear() - DATA.age);\n  return new Date(by, DATA.month, DATA.day);\n}\nfunction ymd(from, to) {\n  let y = to.getFullYear() - from.getFullYear(), m = to.getMonth() - from.getMonth(), d = to.getDate() - from.getDate();\n  if (d < 0) { m--; d += new Date(to.getFullYear(), to.getMonth(), 0).getDate(); }\n  if (m < 0) { y--; m += 12; }\n  return { y, m, d };\n}\n\n/* ========================================================================\n   [KODE: LOAD-10] DOWNLOAD SEMUA DATA DI AWAL (txt, lagu, gambar album)\n   ======================================================================== */\nconst store = { songUrl: null, images: [], fatal: null, notes: [] };\nconst prog = {};\nasync function fetchBlob(url, key) {\n  const p = prog[key];\n  const res = await fetch(encodeURI(url));\n  if (!res.ok) throw new Error('HTTP ' + res.status + ' → ' + url);\n  const total = +res.headers.get('Content-Length') || 0;\n  if (!res.body || !res.body.getReader) { const b = await res.blob(); p.v = 1; return b; }\n  const reader = res.body.getReader(), chunks = []; let got = 0;\n  for (;;) {\n    const { done, value } = await reader.read();\n    if (done) break;\n    chunks.push(value); got += value.length;\n    p.v = total ? Math.min(got / total, .995) : 1 - 1 / (1 + got / 250000);\n  }\n  p.v = 1;\n  return new Blob(chunks, { type: res.headers.get('Content-Type') || '' });\n}\nfunction loadAll() {\n  const tasks = [];\n  applyKartu();\n  if (CFG.SONG_FILE) {\n    prog.song = { v: 0, w: 60 };\n    /* cadangan: kalau fetch gagal (mis. index.html dibuka dengan klik dua kali / file://), coba muat lagu langsung lewat elemen audio */\n    const probe = url => new Promise((ok, no) => {\n      const a = new Audio(), to = setTimeout(() => no(new Error('timeout')), 20000); a.preload = 'auto';\n      a.addEventListener('loadedmetadata', () => { clearTimeout(to); ok(); }, { once: true });\n      a.addEventListener('error', () => { clearTimeout(to); no(new Error('audio error')); }, { once: true });\n      a.src = encodeURI(url);\n    });\n    tasks.push(fetchBlob(CFG.SONG_FILE, 'song').then(b => { store.songUrl = URL.createObjectURL(new Blob([b], { type: 'audio/mpeg' })); })\n      .catch(e => probe(CFG.SONG_FILE).then(() => { store.songUrl = encodeURI(CFG.SONG_FILE); prog.song.v = 1; })\n        .catch(e2 => { prog.song.v = 1; store.notes.push('Lagu \"' + CFG.SONG_FILE + '\" tidak ditemukan. P icArmed = true;\n  const evs = ['pointerup', 'touchend', 'click', 'keydown'];\n  const off = () => evs.forEach(n => window.removeEventListener(n, go, true));\n  function go(e) {\n    if (e && e.target && e.target.closest && e.target.closest('#audio')) return;   // biar tombol play/pause bekerja normal\n    if (userPaused) return off();\n    audio.play().then(off).catch(() => {});\n  }\n  evs.forEach(n => window.addEventListener(n, go, true));\n}\n\n/* ========================================================================\n   [KODE: PZL-11] GAMBAR PUZZLE (dibuat otomatis bertema galaksi)\n   ======================================================================== */\nasync function makePuzzleImage() {\n  try { await document.fonts.load('700 100px \"Dancing Script\"'); } catch (e) {}\n  const S = 720, c = document.createElement('canvas'); c.width = c.height = S; const x = c.getContext('2d');\n  let g = x.createLinearGradient(0, 0, S, S); g.addColorStop(0, '#04030d'); g.addColorStop(.5, '#150832'); g.addColorStop(1, '#2a0d4a'); x.fillStyle = g; x.fillRect(0, 0, S, S);\n  const cols = ['150,80,255', '255,90,170', '70,130,255', '40,200,255', '255,150,90'];\n  for (let i = 0; i < 18; i++) {\n    const bx = Math.random() * S, by = Math.random() * S, br = 110 + Math.random() * 230, col = cols[i % cols.length];\n    const rg = x.createRadialGradient(bx, by, 0, bx, by, br); rg.addColorStop(0, `rgba(${col},.32)`); rg.addColorStop(1, `rgba(${col},0)`); x.fillStyle = rg; x.fillRect(0, 0, S, S);\n  }\n  for (let i = 0; i < 2800; i++) { // spiral galaksi samar\n    const r = Math.pow(Math.random(), 1.4) * 340, a = (i % 3) * 2.094 + r * .017 + gauss() * .22;\n    const px = S / 2 + Math.cos(a) * r, py = S / 2 + Math.sin(a) * r * .75;\n    x.fillStyle = `rgba(${r < 90 ? '255,220,170' : '190,170,255'},${.15 + Math.random() * .4})`; x.fillRect(px, py, 1.6, 1.6);\n  }\n  for (let i = 0; i < 950; i++) { x.fillStyle = `rgba(255,255,255,${.25 + Math.random() * .75})`; const s = Math.ran  c.toDataURL('image/jpeg', .92);\n}\n\n/* ========================================================================\n   [KODE: PZL-10] LOGIKA PUZZLE (default 3x3, 1 kepingan hilang, geser-geser)\n   ======================================================================== */\nconst Puzzle = {\n  N: CFG.PUZZLE_N, cells: [], tiles: [], started: false, solved: false, skipTimer: null,\n  async init() {\n    const N = this.N; this.board = $('#pzl-board'); this.EMPTY = N * N - 1;\n    const img = await makePuzzleImage(); this.sizeBoard();\n    for (let id = 0; id < N * N; id++) {\n      const t = document.createElement('div'); t.className = 'tile' + (id === this.EMPTY ? ' ghost' : '');\n      t.style.width = t.style.height = (100 / N) + '%';\n      t.style.backgroundImage = `url(${img})`; t.style.backgroundSize = `${N * 100}% ${N * 100}%`;\n      t.style.backgroundPosition = `${(id % N) / (N - 1) * 100}% ${Math.floor(id / N) / (N - 1) * 100}%`;\n      t.addEventListener('click', () => this.tap(id)); this.board.appendChild(t); this.tiles[id] = t;\n    }\n    this.cells = Array.from({ length: N * N }, (_, i) => i);\n    let last = -1, ep = this.EMPTY;\n    for (let s = 0; s < CFG.SHUFFLE || this.isSolved(); s++) {\n      const r = Math.floor(ep / N), c = ep % N, nb = [];\n      if (r > 0) nb.push(ep - N); if (r < N - 1) nb.push(ep + N); if (c > 0) nb.push(ep - 1); if (c < N - 1) nb.push(ep + 1);\n      const opts = nb.filter(p => p !== last), pick = opts[(Math.random() * opts.length) | 0];\n      this.cells[ep] = this.cells[pick]; this.cells[pick] = this.EMPTY; last = ep; ep = pick;\n    }\n    this.render(true);\n    window.addEventListener('keydown', e => this.key(e));\n  },\n  sizeBoard() {\n    const vw = innerWidth, vh = innerHeight, small = Math.min(vw, vh) < 600;   // HP\n    const bs = small\n      ? Math.min(vw * .76, vh * (vw > vh ? .5 : .40), 340)                    // HP: lebih kecil agar proporsional\n      : Math.min(vw * .9, vh * .54, 520);
